[project]
name = "lifeline"
version = "0.1.0"
description = "Flood damage and cut-off villages from free satellite data, with a bilingual situation-report copilot"
authors = [
    { name = "Dhiraj", email = "DKA137@SFU.CA" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "fastapi>=0.143.0",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "planetary-computer>=1.0.0",
    "pydantic>=2.14.1",
    "pyproj>=3.8.0",
    "pysheds>=0.5",
    "pystac-client>=0.9.0",
    "python-dotenv>=1.2.4",
    "rasterio>=1.5.2",
    "reportlab>=5.0.1",
    "requests>=2.34.2",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "segmentation-models-pytorch>=0.5.0",
    "shapely>=2.2.0",
    "torch>=2.4,<2.9",
    "torchvision>=0.19,<0.24",
    "uharfbuzz>=0.56.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
lifeline = "lifeline.pipeline:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]

# CPU wheels on Linux (the hosted engine has no GPU); macOS and Windows use PyPI
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
